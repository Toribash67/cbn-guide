name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [game-updated]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guide
        uses: actions/checkout@v4

      - name: Checkout game
        uses: actions/checkout@v4
        with:
          repository: Toribash67/Cataclysm-BN
          ref: main
          path: game

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run generator unit tests
        run: node --test scripts/lib/*.test.mjs

      - name: Generate data
        run: node scripts/generate-data.mjs game

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Extract game build number
        run: echo "GAME_SHA=$(jq -r '.[0].build_number' public/builds.json)" >> "$GITHUB_ENV"

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cbn-guide-web" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.GAME_SHA }}
